spring.application.name=chatapp

# --- MySQL ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chatapp_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:chatapp_user}
spring.datasource.password=${DB_PASSWORD:chatapp_pass}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Upload limits ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Server ---
server.port=${SERVER_PORT:8080}
